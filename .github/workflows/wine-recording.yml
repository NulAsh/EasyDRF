name: Test the EasyDRF recording dialog under Wine
on:
  push:
    branches: [build/wine-recording-regression]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine and a virtual audio device
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends wine wine32:i386 gcc-mingw-w64-i686 xvfb xauth pulseaudio pulseaudio-utils
      - name: Record through the real Wave Out menu
        run: |
          export WINEARCH=win32 WINEPREFIX="$RUNNER_TEMP/wine" DISPLAY=:90
          export WINEDLLOVERRIDES="winemenubuilder.exe=d" WINEDEBUG=-all,err+all
          Xvfb :90 -screen 0 1280x1024x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cassette
          pactl set-default-sink cassette
          pactl set-default-source cassette.monitor
          wineboot -u
          wineserver -w
          i686-w64-mingw32-gcc -std=c11 -O2 -static tests/gui-wave.c -o "$RUNNER_TEMP/gui-wave.exe"
          mkdir "$RUNNER_TEMP/recording"
          cd "$RUNNER_TEMP/recording"
          timeout 160 wine "$RUNNER_TEMP/gui-wave.exe" "$(winepath -w "$GITHUB_WORKSPACE/Release/EasyDRF.exe")"
          python -c "import wave,glob; w=wave.open(glob.glob('WaveOut/*.wav')[0]); print(w.getparams()); assert w.getframerate()==48000 and w.getnframes()>0"
